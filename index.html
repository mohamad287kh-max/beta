<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سایت آزمایشی</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family:Tahoma, sans-serif;
    color:#fff;
    padding:20px;
  }
  .card {
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;
    padding:50px 40px;
    text-align:center;
    max-width:500px;
    width:100%;
    backdrop-filter:blur(10px);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    animation:fadeIn 0.8s ease;
  }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
  }
  .icon {
    font-size:60px;
    margin-bottom:20px;
    animation:pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.1); }
  }
  h1 {
    font-size:28px;
    margin-bottom:15px;
    background:linear-gradient(90deg, #4facfe, #00f2fe);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .beta {
    display:inline-block;
    background:rgba(255,193,7,0.15);
    border:1px solid rgba(255,193,7,0.5);
    color:#ffc107;
    padding:6px 18px;
    border-radius:20px;
    font-size:14px;
    margin-bottom:25px;
    font-weight:bold;
  }
  p {
    font-size:15px;
    line-height:1.8;
    color:#a0a0c0;
  }
  .divider {
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    margin:25px 0;
  }
  .footer {
    font-size:12px;
    color:#606080;
    margin-top:20px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🚧</div>
  <h1>سایت آزمایشی</h1>
  <div class="beta">⚠️ نسخه بتا</div>
  <p>
    این یک سایت آزمایشی است که فقط برای تست و آزمایش ساخته شده.
    در حال حاضر هیچ محتوای واقعی در این صفحه وجود ندارد.
  </p>
  <div class="divider"></div>
  <p style="font-size:13px;">
    از اینکه از این سایت بازدید کردید سپاسگزاریم 🙏
  </p>
  <div class="footer">Test Site • Beta Version</div>
</div>

</body>
</html>
